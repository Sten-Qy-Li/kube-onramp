  - id: oha
    name: oha
    role: extra
    version: 1.17.0 # Rust; minOS from headers and Rust's platform docs (D43)
    binary: oha
    # Format: "oha 1.17.0" (clap's --version, from Cargo.toml).
    versionCommand: [--version]
    versionRegex: 'oha ([0-9]+\.[0-9]+\.[0-9]+)'
    identity:
      # Cargo.toml description (clap "about"): "Ohayou(...), HTTP load generator,
      # inspired by rakyll/hey with tui animation." Only the ASCII part is matched.
      command: [--help]
      mustMatch: 'HTTP load generator, inspired by rakyll/hey'
    platforms:
      # Plain builds, not "-pgo": the -pgo builds exist only for Linux and Windows.
      windows/amd64:
