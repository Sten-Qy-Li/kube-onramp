# Tools that kube-onramp installs. Adding a tool should only need a new entry here.
#
# Every sha256 was checked against the upstream checksum file AND by hashing the
# downloaded file (oha has no checksum file: GitHub's asset digest is used, D43).
# minOS comes from the Go version inside each binary (read with
# `go version <file>`) and the Go wiki's minimum requirements; for oha (Rust) it
# comes from the binary headers and Rust's documented minimums (D43).
# Last verified: kubelogin 2026-11-11 (D2-D4); kubectl and the extras
# 2026-11-23 (D41-D43).
#
# platforms keys are GOOS/GOARCH. minOS is compared with the OS version:
# Windows NT version (10.0), macOS product version (12.0), Linux kernel (3.2).
# binary is the installed name; ".exe" is added on Windows.
schemaVersion: 1
tools:
  - id: kubectl
    name: kubectl
    role: core
    version: 1.37.2 # cluster server is v1.37.2 (2026-11-23); built with go1.26.10
    binary: kubectl
    versionCommand: [version, --client, -o, json]
    versionRegex: '"gitVersion":\s*"v([0-9]+\.[0-9]+\.[0-9]+)'
    identity:
      command: [version, --client, -o, json]
      mustMatch: '"clientVersion"'
    platforms:
      windows/amd64:
        url: https://dl.k8s.io/release/v1.37.2/bin/windows/amd64/kubectl.exe
        sha256: 1691938f7de0e931969f9968c3601cf32d6b0d573573afb4ce471f3d28f51984
        size: 63470080
        archive: none
        minOS: "10.0"
      darwin/amd64:
        url: https://dl.k8s.io/release/v1.37.2/bin/darwin/amd64/kubectl
        sha256: 88379aff5c8111de6be0a394adffba2819e44cde269f3ab23cef76de1a48eaa8
        size: 63202672
        archive: none
        minOS: "12.0"
      darwin/arm64:
        url: https://dl.k8s.io/release/v1.37.2/bin/darwin/arm64/kubectl
        sha256: 55701af0d51815ee335f240e48acf0959c3c23017ed3fa816e880c4a92bae581
        size: 59609250
        archive: none
        minOS: "12.0"
      linux/amd64:
        url: https://dl.k8s.io/release/v1.37.2/bin/linux/amd64/kubectl
        sha256: c04487523e7aa7d1493f7808174c899db93d7a9cf57531420cd76b9bd415f8f4
        size: 61890722
        archive: none
        minOS: "3.2"

  - id: kubelogin
    name: kubelogin (int128)
    role: core
    version: 1.36.4 # built with go1.26.6
    binary: kubectl-oidc_login
    versionCommand: [version]
    # Format: "kubelogin version v1.36.4 (go1.26.6 windows_amd64)". The v1.36.4
    # release binaries print an empty version; kube-onramp's own copy is then
    # identified by the SHA-256 recorded at install time (DECISIONS.md, D23).
    versionRegex: 'kubelogin version v?([0-9]+\.[0-9]+\.[0-9]+)'
    identity:
      # int128: "Log in to the OpenID Connect provider."
      # Azure (unrelated): "login to azure active directory and populate kubeconfig with AAD tokens"
      command: [--help]
      mustMatch: 'Log in to the OpenID Connect provider'
      mustNotMatch: '(?i)azure active directory'
    platforms:
      windows/amd64:
        url: https://github.com/int128/kubelogin/releases/download/v1.36.4/kubelogin_windows_amd64.zip
        sha256: a68be8ff153a7d3df1de19f272a9879164f55b8bb39298859d0e20c9e2c414ad
        size: 11471605
        archive: zip
        path: kubelogin.exe
        minOS: "10.0"
      darwin/amd64:
