name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to full commit SHAs; tool versions are pinned
# and at least 7 days old when chosen (docs/DECISIONS.md, D17).
env:
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.9.0
  GORELEASER_VERSION: v2.20.0
  TRIVY_VERSION: 0.76.1
  TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel is the closest runner to Machine B (Intel, macOS 13);
        # there is no macOS 13 runner (D18).
        os: [windows-latest, macos-15-intel, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go version
      - run: go vet ./...
      - run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION} ./...

  trivy:
    # The Trivy binary is downloaded and checked against a pinned SHA-256
    # instead of using trivy-action (GHSA-69fq-xp46-6x23, D17).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Trivy (pinned checksum)
        run: |
          set -eu
          f="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$f" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$f"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/trivy"
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/trivy" trivy
          "$RUNNER_TEMP/trivy/trivy" --version
      - name: Scan the repository
        run: |
          "$RUNNER_TEMP/trivy/trivy" fs --exit-code 1 --severity HIGH,CRITICAL --scanners vuln,secret,misconfig .

  release-dry-run:
    # Builds all targets with CGO_ENABLED=0 and checks the GoReleaser config.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --clean
      - name: Check the binaries
        run: |
          set -eu
          ls -l dist/
          for f in kube-onramp_windows_amd64.exe kube-onramp_darwin_amd64 kube-onramp_darwin_arm64 kube-onramp_linux_amd64 checksums.txt; do
            test -f "dist/$f" || { echo "missing dist/$f"; exit 1; }
          done
          ./dist/kube-onramp_linux_amd64 version
