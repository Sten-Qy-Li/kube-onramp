# University of Tartu "DevOps: Automating Software Delivery and Operations", fall 2026.
# Cluster data is public: https://devops.cs.ut.ee/phase3/week9/
# Verified 2026-11-11 (docs/DECISIONS.md, D5).
id: ut-devops
displayName: University of Tartu DevOps course cluster
# Used in sentences: "Add the course cluster to your Kubernetes settings".
clusterNoun: the course cluster

cluster:
  server: https://kubernetes.devops.cs.ut.ee:6443
  # Self-signed CN=kubernetes, valid until 2035-09-07.
  # SHA-256 fingerprint 20:B2:2B:5E:8A:77:22:C6:4D:19:75:6F:FF:65:69:3F:6D:B4:8E:A1:43:8F:17:AC:AD:7C:87:FE:03:4D:90:5E
  certificateAuthorityData: 

oidc:
  issuerURL: https://keycloak.hpc.ut.ee/realms/ETAIS
  clientID: kubernetes.devops.cs.ut.ee
  extraArgs:
    - --oidc-pkce-method=auto

exec:
  apiVersion: client.authentication.k8s.io/v1beta1

kubeconfig:
  cluster: ut-devops
  user: ut-devops-oidc
  contexts:
    staging: ut-devops-staging
    prod: ut-devops-prod

# {team} is the normalized team name. The prod namespace appears in Phase 4;
# confirm its exact name then.
namespaces:
  staging: ns-{team}-staging
  prod: ns-{team}-prod

teamExample: best-team

accessChecks:
  staging:
    required:
      - {verb: get, resource: pods}
    informational:
      - {verb: list, resource: deployments.apps}
      - {verb: create, resource: deployments.apps}
      - {verb: create, resource: secrets}
      - {verb: list, resource: services}
  # Prod failures are warnings (W-PROD-NOT-YET) until Phase 4.
  prod:
    required:
      - {verb: get, resource: pods}

loginWording: your University of Tartu account

helpLinks:
  - {name: Course website, url: "https://courses.cs.ut.ee/2026/DevOps/fall"}
  - {name: ETAIS (namespaces and access), url: "https://minu.etais.ee"}
  - {name: Grafana, url: "https://monitoring.kubernetes.devops.cs.ut.ee/"}
